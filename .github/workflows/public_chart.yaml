name: Publish Helm Chart to GitHub Pages

on:
  push:
    branches:
      # Cambia 'main' por la rama donde desarrollas tu chart si no es main
      - master
    # Opcional: si tu chart no está en la raíz, especifica la ruta
    # paths:
    #   - 'tu-aplicacion/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Necesitamos hacer checkout de la rama donde desarrollas y de la rama gh-pages
          fetch-depth: 0 # Necesario para trabajar con múltiples ramas

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.9.0 # Puedes ajustar la versión de Helm si lo necesitas

      - name: Package Helm chart
        run: |
          # Empaqueta tu chart. Asegúrate de que la ruta sea correcta.
          helm package . # <-- ¡Ajusta esta ruta si tu chart no está en la raíz!

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Checkout gh-pages branch
        run: |
          # Clona la rama gh-pages en una carpeta separada.
          # Ya la creamos manualmente antes, pero este comando también funciona.
          git checkout gh-pages

      - name: Move packaged chart
        run: |
          # Mueve el archivo .tgz generado a la rama gh-pages
          # El archivo .tgz estará en el directorio raíz después del 'helm package'
          mv ${{ github.workspace }}/*.tgz .

      - name: Update chart index
        run: |
          # Actualiza el archivo index.yaml
          # '.': busca gh-pages en el directorio actual (la rama gh-pages)
          # '--url': La URL base de tu repositorio de gh-pages en GitHub Pages
          # ${{ github.repository_owner }} será tu usuario o organización
          # ${{ github.event.repository.name }} será el nombre de este nuevo repositorio de gh-pages
          helm repo index . --url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Commit and push changes
        run: |
          git add .
          git commit -m "Publish Helm chart ${{ github.sha }}" || echo "No changes to commit"
          git push origin gh-pages